<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09100d">
  <meta name="robots" content="noindex, nofollow">
  <title>Connexion — La Forêt Enchantée</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body{font-family:Inter,sans-serif}.password-wrap{position:relative}.password-wrap input{padding-right:48px;width:100%}.btn-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:0;font-size:1.05rem;cursor:pointer;opacity:.65;padding:4px}.login-message{border-radius:10px;padding:12px;margin-top:1rem;text-align:center;font-size:.9rem;display:none}.login-message.success{display:block;background:#2d6a4a;color:#d4f0e0;border:1px solid #4a9a6a}.login-message.error{display:block;background:#6a2d2d;color:#f0d4d4;border:1px solid #9a4a4a}
  </style>
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">🌲 La Forêt Enchantée</div>
      <div class="login-sub">Administration commune · Médiathèque & Wikignose</div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Adresse e-mail</label>
          <input type="email" id="email" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="password">Mot de passe</label>
          <div class="password-wrap">
            <input type="password" id="password" autocomplete="current-password" required>
            <button type="button" class="btn-eye" id="btn-eye" aria-label="Afficher le mot de passe">👁</button>
          </div>
        </div>
        <button class="btn-primary" id="btn-login" type="submit">Se connecter</button>
      </form>

      <div class="login-message" id="login-message" role="status" aria-live="polite"></div>
      <p style="margin-top:1.5rem"><a href="index.html" style="font-size:.85rem;opacity:.6">← Retour à la médiathèque</a></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const message = document.getElementById('login-message');
    const button = document.getElementById('btn-login');

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `login-message ${type}`;
    }

    async function isAuthorizedAdmin() {
      const { data, error } = await dbClient.rpc('is_app_admin');
      return !error && data === true;
    }

    getSession().then(async session => {
      if (!session) return;
      if (await isAuthorizedAdmin()) location.replace('admin.html');
      else await dbClient.auth.signOut();
    });

    document.getElementById('btn-eye').addEventListener('click', () => {
      const input = document.getElementById('password');
      const reveal = input.type === 'password';
      input.type = reveal ? 'text' : 'password';
      document.getElementById('btn-eye').textContent = reveal ? '🙈' : '👁';
      document.getElementById('btn-eye').setAttribute('aria-label', reveal ? 'Masquer le mot de passe' : 'Afficher le mot de passe');
    });

    document.getElementById('login-form').addEventListener('submit', async event => {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) return showMessage('Renseigne ton e-mail et ton mot de passe.', 'error');

      button.disabled = true;
      button.textContent = 'Connexion…';
      message.className = 'login-message';

      try {
        const { error } = await signIn(email, password);
        if (error) throw error;
        if (!(await isAuthorizedAdmin())) {
          await dbClient.auth.signOut();
          showMessage('Ce compte est valide mais ne fait pas partie des administrateurs autorisés.', 'error');
          return;
        }
        showMessage('Connexion réussie.', 'success');
        location.replace('admin.html');
      } catch (error) {
        showMessage(error?.message || 'Connexion impossible.', 'error');
      } finally {
        button.disabled = false;
        button.textContent = 'Se connecter';
      }
    });
  </script>
</body>
</html>
