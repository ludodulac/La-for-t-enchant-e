name: Cover image checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check cover image files
        shell: bash
        run: |
          set -euo pipefail
          test -f js/admin-cover-editor.js
          test -f js/admin-story-flow.js
          test -f css/admin-covers.css
          test -f css/admin-story-flow.css
          test -f assets/covers/manifest.json
          test -f supabase/migrations/20260910_add_composed_cover_metadata.sql
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check js/admin-cover-editor.js
          node --check js/admin-story-flow.js
      - name: Check final image manifest
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs");const path=require("path");const p="assets/covers/manifest.json";const x=JSON.parse(fs.readFileSync(p,"utf8"));if(!Array.isArray(x))process.exit(1);for(const a of x){if(!a.id||!a.label||!a.file)process.exit(1);const full=path.join("assets/covers",a.file);if(!fs.existsSync(full))process.exit(1)}'
      - name: Check direct image cover contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "assets/covers/manifest.json" js/admin-cover-editor.js
          grep -q "Choisir une image prête" js/admin-cover-editor.js
          grep -q "cover_color: null" js/admin-cover-editor.js
          grep -q "assetFile" js/admin-cover-editor.js
          if grep -q "ForestCoverComposer" js/admin-cover-editor.js; then
            echo 'Final cover images must not use the old composition engine.'
            exit 1
          fi
          if grep -q "cover-composer.js" js/auth.js; then
            echo 'Admin must not load the old composition engine.'
            exit 1
          fi
          if grep -q "cover-swatch\|customColor\|safeColor" js/admin-cover-editor.js; then
            echo 'Color controls must not remain in the final image selector.'
            exit 1
          fi
      - name: Check admin integration contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q "js/admin-cover-editor.js" js/auth.js
          grep -q "js/admin-story-flow.js" js/auth.js
          grep -q "css/admin-covers.css" js/auth.js
          grep -q "css/admin-story-flow.css" js/auth.js
          grep -q "illustration_key" js/admin-cover-editor.js
          grep -q "cover_color" js/admin-cover-editor.js
          grep -q "uploadVerified" js/admin-cover-editor.js
          grep -q "verifyRow" js/admin-cover-editor.js
          grep -q "Choisir une histoire proposée" js/admin-story-flow.js
          grep -q "Rechercher une image" js/admin-story-flow.js
          grep -q "illustration_key" supabase/migrations/20260910_add_composed_cover_metadata.sql
          grep -q "cover_color" supabase/migrations/20260910_add_composed_cover_metadata.sql
      - name: Ensure no embedded base64 architecture
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'data:[^;]+;base64|base64,' \
            --include='*.html' --include='*.js' --include='*.json' --include='*.css' \
            --exclude-dir=.git .; then
            echo 'Embedded Base64 payload found in text assets.'
            exit 1
          fi
