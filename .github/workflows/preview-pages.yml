name: Preview refonte sur GitHub Pages

on:
  push:
    branches:
      - redesign/premium-media-library
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer la preview statique
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          shopt -s dotglob extglob
          for item in *; do
            case "$item" in
              _site|.git|.github|supabase|docs|README.md|LICENSE) continue ;;
            esac
            cp -R "$item" _site/
          done
          touch _site/.nojekyll

      - name: Charger l’artefact Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Déployer la preview
        id: deployment
        uses: actions/deploy-pages@v4
