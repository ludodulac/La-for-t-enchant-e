name: Déploiement production GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v6

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer le site statique
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          shopt -s dotglob
          for item in *; do
            case "$item" in
              _site|.git|.github|supabase|docs|README.md|LICENSE) continue ;;
            esac
            cp -R "$item" _site/
          done
          touch _site/.nojekyll

      - name: Charger l’artefact Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
