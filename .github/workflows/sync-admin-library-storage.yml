name: Sync admin illustration storage

on:
  push:
    branches:
      - simplify-final-cover-images

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync 252 illustrations to Supabase Storage
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS 'https://jwyayfkssyagvnablttg.supabase.co/functions/v1/sync-admin-library-from-github'
