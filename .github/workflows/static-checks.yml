name: Static checks

on:
  pull_request:
  push:
    branches:
      - main
      - redesign/premium-media-library

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in js/*.js data/*.js; do
            [ -f "$file" ] || continue
            node --check "$file"
          done
      - name: Check required integrated surfaces
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f audio.html
          test -f admin.html
          test -f login.html
          test -f blog.html
          test -f article.html
          test -f wikignose.html
          test -f css/blog-2026.css
          test -f js/wikignose.js
          test -f js/admin-wikignose.js
          test -f js/admin-blog-safety.js
          test -f data/wikignose-index.js
          test -f docs/WIKIGNOSE.md
          test -f supabase/migrations/20260904_wikignose_module.sql
          test -f supabase/migrations/20260904_unify_admin_permissions.sql
          test -f supabase/migrations/20260904_add_fk_indexes.sql
          test -f supabase/migrations/20260904_wikignose_pdf_sha256.sql
          test -f supabase/migrations/20260904_consolidate_article_select_policies.sql
      - name: Check public page contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'id="main-content"' index.html
          grep -q 'id="mini-player"' index.html
          grep -q 'id="blog-grid"' blog.html
          grep -q 'id="blog-filters"' blog.html
          grep -q 'id="article-content"' article.html
          grep -q 'id="article-bc-title"' article.html
          grep -q 'js/blog.js' blog.html
          grep -q 'js/blog.js' article.html
      - name: Check Supabase project consistency
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'jwyayfkssyagvnablttg' js/supabase.js
          if grep -R 'jwtawyeuyvqjikjvfhri' --include='*.js' --include='*.html' js data ./*.html; then
            echo 'Ancienne référence Supabase Wikignose trouvée dans du code actif.' >&2
            exit 1
          fi
      - name: Check Wikignose product separation
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'name="robots" content="noindex, nofollow"' wikignose.html
          grep -q 'Outils · Wikignose' index.html
          grep -q 'sha256File' js/admin-wikignose.js
          grep -q 'data-wg-delete' js/admin-wikignose.js
          if grep -q 'aria-label="Ouvrir Wikignose"' index.html; then
            echo 'Wikignose ne doit pas redevenir une action principale de la médiathèque.' >&2
            exit 1
          fi
